name: OpenWrt CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    permissions:
      contents: read
      actions: read
    
    outputs:
      version: ${{ steps.info.outputs.version }}
      build_time: ${{ steps.info.outputs.time }}
    
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
            jq tree

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get build info
        id: info
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          
          # 优先使用 API 获取准确时间
          TIME="$(curl -sSf -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -r '.created_at // empty')" || TIME=""
          
          [ -z "$TIME" ] && TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          VERSION="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA:0:8}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT
          echo "${VERSION}" > version.buildinfo
          echo "Built version: ${VERSION}"
          echo "Build time: ${TIME}"

      - name: Hook the openwrt_core URL for opkg
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BRANCH="${GITHUB_REF_NAME}"
          # 使用更精确的替换
          sed -i "s|https://downloads.openwrt.org/releases/%R/packages-%A|https://${OWNER}.github.io/${REPO}/${BRANCH}/%R|g" include/feeds.mk
          sed -i "s|%U/targets/%S/packages|https://${OWNER}.github.io/${REPO}/${BRANCH}/%R|g" include/feeds.mk

      - name: Restore cache
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            dl/
            staging_dir/
            .ccache/
          key: openwrt-${{ github.ref_name }}-${{ hashFiles('.config', 'feeds.conf*', 'Makefile') }}
          restore-keys: |
            openwrt-${{ github.ref_name }}-
            openwrt-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat <<'EOF' > .config
          CONFIG_TARGET_ipq50xx=y
          CONFIG_TARGET_ipq50xx_arm=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_ALL_PROFILES=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_IB=y
          CONFIG_SDK=y
          CONFIG_MAKE_TOOLCHAIN=y
          CONFIG_ALL_NONSHARED=y
          CONFIG_REPRODUCIBLE_DEBUG_INFO=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-easymesh=y
          CONFIG_CCACHE=y
          EOF
          make defconfig

      - name: Download sources
        run: |
          set +e
          make -j$(nproc) download
          if [ $? -ne 0 ]; then
            echo "::warning::Parallel download failed, retrying..."
            make -j1 download V=s
          fi
          set -e

      - name: Build tools
        run: |
          set +e
          make -j$(nproc) tools/install
          if [ $? -ne 0 ]; then
            echo "::warning::Parallel tools build failed, retrying..."
            make -j1 tools/install V=s
          fi
          set -e

      - name: Build toolchain
        run: |
          set +e
          make -j$(nproc) toolchain/install
          if [ $? -ne 0 ]; then
            echo "::warning::Parallel toolchain build failed, retrying..."
            make -j1 toolchain/install V=s
          fi
          set -e

      - name: Build all
        run: |
          set +e
          make -j$(nproc)
          if [ $? -ne 0 ]; then
            echo "::warning::Parallel build failed, retrying with single job..."
            make -j1 V=s
          fi
          set -e

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dl/
            staging_dir/
            .ccache/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Prepare artifacts
        run: |
          # 创建版本信息文件
          echo "Build Version: ${{ steps.info.outputs.version }}" > build-info.txt
          echo "Build Time: ${{ steps.info.outputs.time }}" >> build-info.txt
          echo "Git SHA: ${GITHUB_SHA}" >> build-info.txt
          echo "Git Ref: ${GITHUB_REF_NAME}" >> build-info.txt
          echo "Workflow: ${GITHUB_WORKFLOW}" >> build-info.txt
          
          # 复制到输出目录
          cp build-info.txt bin/targets/ipq50xx/arm/
          cp version.buildinfo bin/targets/ipq50xx/arm/

      - name: Upload bin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-binaries
          path: |
            bin/targets/ipq50xx/arm/*
            !bin/targets/ipq50xx/arm/packages/
          retention-days: 7

      - name: Upload packages artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages
          path: bin/targets/ipq50xx/arm/packages/
          retention-days: 7

  gh-pages:
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: github.ref_name == 'main' || github.ref_name == 'master'
    
    steps:
      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: openwrt-binaries
          path: artifacts/

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Prepare gh-pages structure
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          BRANCH="${GITHUB_REF_NAME}"
          
          # 创建目录结构
          mkdir -p "gh-pages/${BRANCH}/${VERSION}/"
          mkdir -p "gh-pages/${BRANCH}/packages/"
          
          # 复制文件
          if [ -d "artifacts/" ]; then
            echo "Copying artifacts to gh-pages..."
            find artifacts/ -type f -exec cp {} "gh-pages/${BRANCH}/${VERSION}/" \;
          fi
          
          # 创建软链接到最新版本
          cd "gh-pages/${BRANCH}"
          rm -f latest
          ln -sf "${VERSION}" latest
          
          # 创建索引文件
          {
            echo "# OpenWrt Builds for ${BRANCH}"
            echo ""
            echo "Latest build: "
            echo ""
            echo "## Available builds:"
            find . -maxdepth 1 -type d -name "ci-*" | sort -r | while read dir; do
              if [ "$dir" != "." ]; then
                echo "- "
              fi
            done
          } > index.md

      - name: Deploy to GitHub Pages
        run: |
          cd gh-pages
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy: ${GITHUB_REF_NAME} - ${{ needs.build.outputs.version }}"
          git push origin gh-pages

  release:
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: openwrt-binaries
          path: release-files/

      - name: Prepare release files
        run: |
          # 创建发布目录
          mkdir -p release/
          
          # 复制所有文件
          if [ -d "release-files/" ]; then
            cp -r release-files/* release/
          fi
          
          # 创建压缩包
          cd release
          tar czf ../openwrt-ipq50xx-arm-${{ needs.build.outputs.version }}.tar.gz .
          cd ..
          
          # 生成 SHA256 校验和
          sha256sum openwrt-ipq50xx-arm-${{ needs.build.outputs.version }}.tar.gz > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: OpenWrt ${{ github.ref_name }} - ${{ needs.build.outputs.version }}
          body: |
            # OpenWrt Build ${{ github.ref_name }}
            
            Build Information:
            - Version: ${{ needs.build.outputs.version }}
            - Build Time: ${{ needs.build.outputs.time }}
            - Git Commit: ${{ github.sha }}
            
            SHA256 Checksum:
            ```
            $(cat checksums.txt)
            ```
            
            Included Packages:
            $(if [ -f release/feeds.buildinfo ]; then cat release/feeds.buildinfo | awk '{print "- " $0}'; fi)
          files: |
            openwrt-ipq50xx-arm-${{ needs.build.outputs.version }}.tar.gz
            checksums.txt
