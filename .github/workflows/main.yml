name: CI - IPQ50XX Packages Feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-packages:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/pipx
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
            lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd \
            zlib1g-dev zstd

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "OWNER=$OWNER" >> $GITHUB_ENV
          echo "REPO=$REPO" >> $GITHUB_ENV

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for IPQ50XX packages
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          
          # 不生成固件镜像，只编译软件包
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
          # CONFIG_TARGET_ROOTFS_EXT4FS is not set
          # CONFIG_TARGET_ROOTFS_INITRAMFS is not set
          # CONFIG_TARGET_ROOTFS_CPIOGZ is not set
          
          # 启用软件包编译相关选项
          CONFIG_DEVEL=y
          CONFIG_BUILD_ALL_HOST_TOOLS=y
          CONFIG_ALL_NONSHARED=y
          CONFIG_REPRODUCIBLE_DEBUG_INFO=y
          
          # 包含 kmod 和其他需要的包
          CONFIG_PACKAGE_kmod-sched-cake=m
          CONFIG_PACKAGE_kmod-tcp-bbr=m
          CONFIG_PACKAGE_kmod-zram=m
          
          # Luci 和其他软件包
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          EOF
          
          make defconfig

      - name: Download sources
        run: |
          make download -j$(nproc) V=s

      - name: Build tools
        run: |
          make tools/install -j$(nproc) V=s || make tools/install -j1 V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) V=s || make toolchain/install -j1 V=s

      - name: Build target tools
        run: |
          make target/compile -j$(nproc) V=s || make target/compile -j1 V=s

      - name: Build packages (including kmod)
        run: |
          # 编译所有软件包，包括内核模块
          make package/compile -j$(nproc) V=s IGNORE_ERRORS=1 || \
          make package/compile -j1 V=s IGNORE_ERRORS=1

      - name: Install packages to staging
        run: |
          make package/install -j$(nproc) V=s || true

      - name: Build package index
        run: |
          make package/index V=s

      - name: Collect packages
        run: |
          mkdir -p packages-collected
          # 收集所有 ipk/apk 包（包括 kmod）
          find bin/targets/qualcommax/ipq50xx/packages -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp -v {} packages-collected/ \;
          # 复制软件源索引文件
          find bin/targets/qualcommax/ipq50xx/packages -type f -name "Packages*" -exec cp -v {} packages-collected/ \;
          ls -lah packages-collected/

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipq50xx-packages-${{ github.run_id }}
          path: packages-collected/*
          retention-days: 14

      - name: Upload dl artifact
        uses: actions/upload-artifact@v4
        with:
          name: dl-cache-${{ github.run_id }}
          path: dl/*
          retention-days: 3

  release-packages:
    needs: build-packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: ipq50xx-packages-${{ github.run_id }}
          path: packages/

      - name: Generate release info
        run: |
          TIME=$(date -u +'%Y%m%d-%H%M%S')
          TAG="ipq50xx-packages-${GITHUB_REF_NAME}-${TIME}"
          
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "TIME=$TIME" >> $GITHUB_ENV
          
          # 统计包数量
          PKG_COUNT=$(find packages/ -name "*.ipk" -o -name "*.apk" | wc -l)
          KMOD_COUNT=$(find packages/ -name "kmod-*.ipk" -o -name "kmod-*.apk" | wc -l)
          
          cat > Release.md << EOF
          ## IPQ50XX Packages Feed - ${GITHUB_REF_NAME}
          
          **Build Time:** ${TIME} UTC  
          **Total Packages:** ${PKG_COUNT}  
          **Kernel Modules (kmod):** ${KMOD_COUNT}  
          **Commit:** ${GITHUB_SHA:0:8}
          
          ### 包含内容
          - 所有用户空间软件包 (ipk/apk)
          - 内核模块 (kmod-*) - 需与固件内核版本匹配
          - 软件源索引 (Packages, Packages.gz)
          
          ### 使用方法
          
          1. 下载并解压到本地 HTTP 服务器目录，或
          2. 直接添加到 OpenWrt 软件源：
          
          \`\`\`sh
          echo "src/gz github_packages https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" >> /etc/opkg/customfeeds.conf
          opkg update
          \`\`\`
          
          > ⚠️ **注意：** kmod 包需要与固件内核版本严格匹配，建议优先使用 \`opkg install --force-depends\` 或自行编译完整固件。
          
          ### 文件列表
          EOF
          
          ls -1 packages/ >> Release.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: IPQ50XX Packages ${{ env.TIME }}
          body_path: Release.md
          files: packages/*
          prerelease: true
